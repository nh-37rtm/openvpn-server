[project]

name = "openvpn-scripts"
requires-python = ">=3.11"
version = "0.1.0"

dependencies = [
    "jinja2",
    "pyyaml",
    "jinja-templating @ file:///app/JinjaTemplating", 
]

[project.optional-dependencies]
dev = ["pylint", "pytest"]

[tool.pytest.ini_options]

log_cli = "True"
log_cli_level = "DEBUG"